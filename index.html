<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absen SMP Negeri 2 Ulubongka</title>
<link rel="icon" type="image/png" href="https://res.cloudinary.com/fkpigfea/image/upload/f_auto,q_auto/Untitled_Design_2">
<link rel="apple-touch-icon" href="https://res.cloudinary.com/fkpigfea/image/upload/f_auto,q_auto/Untitled_Design_2">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  /* Baseline safe styles */
  img { max-width: 100%; height: auto; }
  .app-logo { width: 46px; height: 46px; object-fit: contain; flex-shrink: 0; }
  .brand .app-logo { width: 38px; height: 38px; }
</style>
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="ld" class="ld" style="display:none"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Memuat…</span></div></div>
<div id="bar" class="bar"></div>

<!-- Layar Login langsung tampil secara default tanpa overlay splash blocker -->
<div id="login" class="lg">
  <div class="lgc">
    <div class="lgh">
      <img src="https://res.cloudinary.com/fkpigfea/image/upload/f_auto,q_auto/Untitled_Design_2" alt="Logo SMP Negeri 2 Ulubongka" class="app-logo">
      <div>
        <b>SMP Negeri 2 Ulubongka</b>
        <small>Portal Presensi Digital</small>
      </div>
    </div>
    <div id="loginAlert" class="alert alert-danger py-2 px-3 small mt-2 mb-2" style="display:none;border-radius:10px"></div>
    <form id="loginForm" onsubmit="window.doLogin && window.doLogin(event); return false;">
      <label for="u">Nama Pengguna</label>
      <input id="u" class="form-control" autocomplete="username" placeholder="Masukkan username" required>
      <label for="pw">Kata Sandi</label>
      <div class="input-group">
        <input id="pw" type="password" class="form-control" autocomplete="current-password" placeholder="Masukkan kata sandi" required>
        <button class="btn btn-outline-secondary" type="button" id="togglePwBtn" title="Tampilkan/sembunyikan kata sandi" style="border-radius:0 12px 12px 0;border-color:var(--bd);background:var(--card);color:var(--mut);">
          <i class="bi bi-eye" id="togglePwIcon"></i>
        </button>
      </div>
      <button type="submit" class="btn-pri w-100 mt-3" id="lb" onclick="window.doLogin && window.doLogin(event);">Masuk ke Portal</button>
    </form>
    <p class="mut small mt-3 mb-0 text-center">Khusus Guru dan Administrator.<br>Lupa kata sandi? Hubungi admin.</p>
  </div>
</div>

<div id="app" style="display: none;">
  <aside class="side" id="side"></aside>

  <!-- Mobile Drawer Overlay & Container -->
  <div id="drawerOverlay" class="drawer-overlay"></div>
  <aside id="drawer" class="mobile-drawer" aria-label="Menu navigasi mobile">
    <div class="drawer-header">
      <div class="brand mb-0 p-0">
        <img src="https://res.cloudinary.com/fkpigfea/image/upload/f_auto,q_auto/Untitled_Design_2" alt="Logo SMPN 2 Ulubongka" class="app-logo">
        <div>
          <b>SMPN 2 Ulubongka</b>
          <small>PRESENSI DIGITAL</small>
        </div>
      </div>
      <button class="ib border-0 text-white" id="btnCloseDrawer" aria-label="Tutup Menu" style="background:transparent">
        <i class="bi bi-x-lg fs-5"></i>
      </button>
    </div>
    <div id="drawerUserInfo" class="drawer-user"></div>
    <div class="drawer-nav" id="drawerNav"></div>
    <div class="drawer-footer pt-3 mt-auto border-top border-secondary border-opacity-25 d-flex gap-2">
      <button class="btn-out text-white border-secondary border-opacity-50 flex-grow-1" id="btnDrawerTheme" style="background:rgba(255,255,255,.05);font-size:12px">
        <i class="bi bi-moon-stars me-1"></i> Mode Tema
      </button>
      <button class="btn-out text-danger border-danger border-opacity-50" id="btnDrawerOut" title="Keluar" style="background:rgba(220,53,69,.1);font-size:12px">
        <i class="bi bi-box-arrow-right"></i> Keluar
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div class="d-flex align-items-center gap-2 min-w-0">
        <button class="ib d-lg-none" id="btnOpenDrawer" aria-label="Buka Menu Navigasi" style="flex-shrink:0">
          <i class="bi bi-list fs-4"></i>
        </button>
        <h1 id="ttl" class="text-truncate"></h1>
      </div>
      <div class="d-flex gap-2 flex-shrink-0">
        <button class="ib" id="btnTopTheme" aria-label="Ganti mode gelap/terang"><i class="bi bi-moon-stars"></i></button>
        <button class="ib" id="btnTopOut" aria-label="Keluar"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </header>
    <div id="view"></div>
  </main>
  <nav class="bnav" id="bnav" aria-label="Navigasi utama"></nav>
</div>

<div id="toast" class="toastx" role="status" aria-live="polite"></div>
<div id="qrFileBox" style="position:fixed;left:-9999px;top:-9999px;width:200px;height:200px;opacity:0;pointer-events:none;"></div>
<div id="modalBox" class="modal-overlay" style="display:none;"><div class="modal-content cardx" id="modalContent"></div></div>

<!-- Core SPA Script dimuat sebelum pustaka eksternal agar form login dan logika dasar langsung jalan -->
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>

<!-- Pustaka eksternal dimuat dengan defer agar tidak memblokir render atau startup aplikasi -->
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</body>
</html>
